<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dholki Invitation</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to bottom, #fff0f5, #ffe4e1);
  overflow: hidden;
}

/* PASSWORD */
#password-screen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #fff0f5;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  text-align: center;
}

.box input {
  padding: 12px;
  font-size: 16px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

.box button {
  padding: 12px 25px;
  margin-top: 10px;
  background: #e91e63;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}

/* CARD */
#card {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  text-align: center;
  background: white;
  padding: 40px;
  width: 90%;
  max-width: 600px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  animation: fadeIn 1s ease forwards;
}

@keyframes fadeIn {
  to {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
}

.title {
  font-size: 42px;
  color: #c2185b;
  font-weight: bold;
}

.subtitle {
  font-size: 28px;
  margin: 10px 0;
  color: #ff4081;
}

.details {
  font-size: 20px;
  margin-top: 20px;
  line-height: 1.6;
}

/* FLOWERS */
.flower {
  position: absolute;
  top: -50px;
  font-size: 24px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
  }
}
</style>

</head>
<body>

<!-- PASSWORD -->
<div id="password-screen">
  <div class="box">
    <h2>🔐 Enter Password</h2>
    <input type="password" id="password" placeholder="Password">
    <br>
    <button onclick="checkPassword()">Enter</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- CARD -->
<div id="card">
  <div class="title">✨ Noor-ul-ain ✨</div>
  <div class="subtitle">💃 DHOLKI NIGHT 🥁</div>

  <div class="details">
    🌸 Join us for a joyful evening 🌸<br>
    filled with music, dance & celebrations 🎶💃✨<br><br>

    📅 <b>Sunday, April 26</b><br>
    ⏰ <b>4:00 PM</b><br><br>

    📍 <b>162B Defence Road</b><br>
    Muhafiz Town Phase 2, Lahore<br><br>

    💖 We can’t wait to celebrate with you! 💖
  </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8e0e0c8a6.mp3?filename=romantic-background-112191.mp3">
</audio>

<script>
function checkPassword() {
  const input = document.getElementById("password").value;

  if (input === "Noor") {
    document.getElementById("password-screen").style.display = "none";
    document.getElementById("card").style.display = "block";

    document.getElementById("music").play();
  } else {
    document.getElementById("error").innerText = "Wrong Password!";
  }
}

// FLOWERS (emoji version)
const flowers = ["🌸","🌺","🌼","💮","🌷"];

function createFlower() {
  const flower = document.createElement("div");
  flower.classList.add("flower");

  flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];

  flower.style.left = Math.random() * window.innerWidth + "px";
  flower.style.animationDuration = (3 + Math.random() * 5) + "s";

  document.body.appendChild(flower);

  setTimeout(() => flower.remove(), 8000);
}

setInterval(createFlower, 300);
</script>

</body>
</html>
